[manifest]
version = "1.0.0"
dump_lua = true
priority = 2147483600

# In-run HUD "Lobby Info" button, shared by every MPAPI-based mod (not
# duplicated per-mod -- this used to live only in BalatroMultiplayerPvP's own
# lovely/hud.toml, which left SPDRN with no in-run entry point at all).
# Gated on MPAPI.get_current_lobby() -- the mod-agnostic "am I in an active
# multiplayer lobby" signal -- rather than any one mod's own tracking global.
# Landed between the Run Info and Options buttons.
#
# minh is fixed at 1.2 (the SHRUNK size the patch below uses for Run Info/
# Options whenever this button is showing) rather than 1.75 -- the button
# row's container sizes to its tallest child, so a 1.75 button sitting next
# to two 1.2-shrunk neighbors would inflate the whole row's height back up
# to 1.75, undoing that patch's compacting for anyone who also has this
# button showing. 1.2 never exceeds either of Run Info/Options' two possible
# sizes (1.2 shrunk, 1.75 default), so the row is never taller than it would
# already be without this button.
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = '''{n=G.UIT.T, config={text = localize('b_run_info_2'), scale = 1*scale, colour = G.C.UI.TEXT_LIGHT, shadow = true, focus_args = {button = G.F_GUIDE and 'guide' or 'back', orientation = 'bm'}, func = 'set_button_pip'}}
            }}
          }},'''
position = 'after'
payload = '''
MPAPI.get_current_lobby() and {n=G.UIT.R, config={id = 'mpapi_lobby_info_button', align = "cm", minh = 1.2, minw = 1.5,padding = 0.05, r = 0.1, hover = true, colour = G.C.BLUE, button = "mpapi_show_lobby_info", shadow = true}, nodes={
    {n=G.UIT.R, config={align = "cm", padding = 0, maxw = 1.4}, nodes={
        {n=G.UIT.T, config={text = localize("b_lobby_info_1"), scale = 1.2*scale, colour = G.C.UI.TEXT_LIGHT, shadow = true}}
    }},
    {n=G.UIT.R, config={align = "cm", padding = 0, maxw = 1.4}, nodes={
        {n=G.UIT.T, config={text = localize("b_lobby_info_2"), scale = 1*scale, colour = G.C.UI.TEXT_LIGHT, shadow = true, focus_args = {button = G.F_GUIDE and 'guide' or 'back', orientation = 'bm'}, func = 'set_button_pip'}}
    }}
}} or nil,'''
match_indent = true
times = 1

# Shrinks the Run Info/Options buttons (vanilla, both minh = 1.75) to match
# the Lobby Info button above whenever it's showing -- generalized here from
# a PvP-only patch (BalatroMultiplayerPvP's old lovely/hud.toml, removed in
# favor of this one) the same way the Lobby Info button itself was, so SPDRN
# gets consistent HUD button heights too instead of only PvP. Condition is
# MPAPI.get_current_lobby() (real lobby of any kind, any mod, matching Lobby
# Info's own gate exactly) OR PVP.is_practice_mode() specifically (guarded on
# `PVP and` so this stays a no-op if PvP isn't loaded) -- PvP's own practice
# mode doesn't go through MPAPI.create_local_lobby the way SPDRN's does, so
# it needs that extra check; SPDRN's practice mode is already covered by
# get_current_lobby() alone.
[[patches]]
[patches.regex]
target = "functions/UI_definitions.lua"
pattern = '''contents\.buttons = \{(?<pre>[\s\S]*?)minh = 1\.75(?<between>[\s\S]*?)minh = 1\.75'''
position = 'at'
payload = '''contents.buttons = {$pre minh = (MPAPI.get_current_lobby() or (PVP and PVP.is_practice_mode and PVP.is_practice_mode())) and 1.2 or 1.75$between minh = (MPAPI.get_current_lobby() or (PVP and PVP.is_practice_mode and PVP.is_practice_mode())) and 1.2 or 1.75'''
times = 1
